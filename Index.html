<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>仙女小金庫 1.2</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:#FBFBFF;
      -webkit-tap-highlight-color:transparent;
    }

    .hidden{
      display:none;
    }

    .card{
      background:white;
      border-radius:28px;
      padding:20px;
      box-shadow:0 10px 30px rgba(0,0,0,0.05);
    }

    .btn-main{
      background:linear-gradient(135deg,#FD85AB,#ff5f8f);
      color:white;
      border:none;
      border-radius:22px;
      font-weight:900;
      width:100%;
      padding:16px;
    }

    .btn-main:active{
      transform:scale(.98);
    }

    .no-scrollbar::-webkit-scrollbar{
      display:none;
    }
  </style>
</head>

<body>

<div class="max-w-md mx-auto min-h-screen bg-white relative overflow-hidden">

  <!-- LOGIN -->
  <section id="auth-screen" class="min-h-screen flex flex-col justify-center p-8 bg-gradient-to-br from-pink-50 to-white">

    <div class="text-center mb-8">
      <div class="w-20 h-20 rounded-full bg-pink-400 flex items-center justify-center mx-auto mb-4 text-white">
        <i data-lucide="sparkles"></i>
      </div>

      <h1 class="text-3xl font-black text-pink-400">
        仙女小金庫 1.2
      </h1>

      <p class="text-xs text-slate-400 font-bold mt-2">
        雲端版 Fairy Money
      </p>
    </div>

    <div class="card space-y-4">

      <input
        id="email"
        type="email"
        placeholder="Email"
        class="w-full p-4 rounded-2xl bg-slate-50 font-bold outline-none"
      />

      <input
        id="password"
        type="password"
        placeholder="Password"
        class="w-full p-4 rounded-2xl bg-slate-50 font-bold outline-none"
      />

      <button onclick="register()" class="btn-main">
        註冊帳號 ✨
      </button>

      <button
        onclick="login()"
        class="w-full p-4 rounded-2xl bg-slate-900 text-white font-black"
      >
        登入
      </button>

      <button
        onclick="guestLogin()"
        class="w-full p-4 rounded-2xl bg-slate-100 font-black text-slate-500"
      >
        訪客模式
      </button>

    </div>

  </section>

  <!-- APP -->
  <section id="app" class="hidden">

    <!-- HEADER -->
    <div class="p-6">

      <div class="flex justify-between items-center">

        <div>
          <h1 class="text-3xl font-black text-pink-400">
            仙女小金庫
          </h1>

          <p class="text-xs text-slate-300 font-bold">
            FAIRY MONEY PRO
          </p>
        </div>

        <button
          onclick="logout()"
          class="bg-red-50 text-red-400 p-3 rounded-2xl"
        >
          <i data-lucide="log-out"></i>
        </button>

      </div>

      <!-- PROFIT -->
      <div class="mt-6 rounded-[32px] bg-gradient-to-br from-pink-400 to-rose-400 p-8 text-white">

        <div class="text-xs font-bold opacity-80">
          本月預估淨利
        </div>

        <div
          id="profit"
          class="text-4xl font-black mt-2"
        >
          $0
        </div>

      </div>

      <!-- CARDS -->
      <div class="grid grid-cols-2 gap-3 mt-4">

        <div class="card">
          <div class="text-[10px] text-slate-300 font-black">
            本月銷貨額
          </div>

          <div
            id="revenue"
            class="text-xl font-black mt-1"
          >
            $0
          </div>
        </div>

        <div class="card">
          <div class="text-[10px] text-slate-300 font-black">
            庫存總數
          </div>

          <div
            id="stock"
            class="text-xl font-black mt-1"
          >
            0
          </div>
        </div>

      </div>

      <!-- SALES -->
      <div class="card mt-5">

        <h3 class="font-black text-pink-400 mb-4">
          新增銷貨
        </h3>

        <div class="space-y-3">

          <input
            id="customer"
            placeholder="客戶名稱"
            class="w-full p-4 rounded-2xl bg-slate-50 font-bold outline-none"
          />

          <select
            id="product"
            class="w-full p-4 rounded-2xl bg-slate-50 font-bold outline-none"
          >
            <option>纖纖飲X</option>
            <option>纖飄錠</option>
            <option>爆纖錠</option>
            <option>益生菌</option>
            <option>固樂纖</option>
          </select>

          <input
            id="qty"
            type="number"
            placeholder="數量"
            class="w-full p-4 rounded-2xl bg-slate-50 font-bold outline-none"
          />

          <button
            onclick="addSale()"
            class="btn-main"
          >
            新增銷貨
          </button>

        </div>

      </div>

      <!-- RECORD -->
      <div class="card mt-5">

        <div class="flex justify-between items-center mb-4">

          <h3 class="font-black text-slate-700">
            歷史紀錄
          </h3>

        </div>

        <div
          id="records"
          class="space-y-3"
        ></div>

      </div>

    </div>

  </section>

</div>

<!-- TOAST -->
<div
  id="toast"
  class="hidden fixed top-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-6 py-4 rounded-3xl z-50 font-black"
></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

import {
  getAuth,
  signInAnonymously,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "你的APIKEY",

  authDomain: "你的project.firebaseapp.com",

  projectId: "你的projectid",

  storageBucket: "你的project.appspot.com",

  messagingSenderId: "xxxx",

  appId: "xxxx"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

let currentUser = null;

let sales = [];

const PRODUCT_PRICE = {

  "纖纖飲X":1480,
  "纖飄錠":1480,
  "爆纖錠":880,
  "益生菌":1280,
  "固樂纖":1680

};

function toast(msg){

  const t = document.getElementById("toast");

  t.innerText = msg;

  t.classList.remove("hidden");

  setTimeout(()=>{

    t.classList.add("hidden");

  },2500);

}

window.register = async function(){

  try{

    const email = document.getElementById("email").value;

    const password = document.getElementById("password").value;

    await createUserWithEmailAndPassword(auth,email,password);

    toast("註冊成功 ✨");

  }catch(e){

    console.log(e);

    toast("註冊失敗");

  }

}

window.login = async function(){

  try{

    const email = document.getElementById("email").value;

    const password = document.getElementById("password").value;

    await signInWithEmailAndPassword(auth,email,password);

    toast("登入成功 💖");

  }catch(e){

    console.log(e);

    toast("登入失敗");

  }

}

window.guestLogin = async function(){

  try{

    await signInAnonymously(auth);

    toast("訪客登入成功");

  }catch(e){

    console.log(e);

    toast("匿名登入失敗");

  }

}

window.logout = async function(){

  await signOut(auth);

}

onAuthStateChanged(auth,(user)=>{

  if(user){

    currentUser = user;

    document.getElementById("auth-screen").classList.add("hidden");

    document.getElementById("app").classList.remove("hidden");

    loadSales();

  }else{

    currentUser = null;

    document.getElementById("auth-screen").classList.remove("hidden");

    document.getElementById("app").classList.add("hidden");

  }

});

window.addSale = async function(){

  const customer = document.getElementById("customer").value || "一般客戶";

  const product = document.getElementById("product").value;

  const qty = Number(document.getElementById("qty").value);

  if(!qty){

    toast("請輸入數量");

    return;

  }

  const price = PRODUCT_PRICE[product];

  const total = qty * price;

  const profit = total * 0.3;

  await addDoc(

    collection(db,"users",currentUser.uid,"sales"),

    {

      customer,
      product,
      qty,
      total,
      profit,
      createdAt:new Date().toISOString()

    }

  );

  document.getElementById("customer").value = "";

  document.getElementById("qty").value = "";

  toast("新增成功 ✨");

}

function loadSales(){

  onSnapshot(

    collection(db,"users",currentUser.uid,"sales"),

    (snapshot)=>{

      sales = snapshot.docs.map(doc=>({

        id:doc.id,
        ...doc.data()

      }));

      render();

    }

  );

}

function render(){

  const totalRevenue = sales.reduce((a,b)=>a+b.total,0);

  const totalProfit = sales.reduce((a,b)=>a+b.profit,0);

  const totalQty = sales.reduce((a,b)=>a+b.qty,0);

  document.getElementById("revenue").innerText =
    "$" + totalRevenue.toLocaleString();

  document.getElementById("profit").innerText =
    "$" + totalProfit.toLocaleString();

  document.getElementById("stock").innerText =
    totalQty;

  document.getElementById("records").innerHTML =
    sales
    .sort((a,b)=>b.createdAt.localeCompare(a.createdAt))
    .map(item=>`

      <div class="bg-slate-50 rounded-2xl p-4">

        <div class="flex justify-between">

          <div>

            <div class="font-black text-sm">
              ${item.customer}
            </div>

            <div class="text-xs text-slate-400 mt-1">
              ${item.product} × ${item.qty}
            </div>

          </div>

          <div class="text-right">

            <div class="font-black text-pink-400">
              $${item.total.toLocaleString()}
            </div>

            <div class="text-[10px] text-emerald-500 font-black">
              +$${Math.round(item.profit).toLocaleString()}
            </div>

          </div>

        </div>

      </div>

    `).join("");

  lucide.createIcons();

}

window.addEventListener("load",()=>{

  lucide.createIcons();

});

</script>

</body>
</html>
