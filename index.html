    cost: 0,

    items: {},

    levelRevenue: Object.fromEntries(
        SALES_LEVELS.map(level => [level, 0])

                const m = s.date ? s.date.substring(0, 7) : '未知月份';
                if(!monthlyData[m]) monthlyData[m] = createEmptyMonth();

                const saleAmount = Number(s.sellPrice || 0) * Number(s.qty || 0);
                const saleLevel = s.customerLevel || '';

                monthlyData[m].rev += saleAmount;
                monthlyData[m].pro += Number(s.profit || 0);
                monthlyData[m].items[s.product] = (monthlyData[m].items[s.product] || 0) + Number(s.qty || 0);

                if (SALES_LEVELS.includes(saleLevel)) {

    // ==========================
    // 銷貨給客人
    // 零售 + 1+1 + VIP

   if (CUSTOMER_SALES_LEVELS.includes(saleLevel)) {

}


    // ==========================

    // 實習 + 三級零售 + 三級加盟
    // + 二級 + 一級 + 皇家
    // ==========================
    if (BRANCH_SALES_LEVELS.includes(saleLevel)) {

    monthlyData[m].branchSalesRevenue += saleAmount;

    monthlyData[m].branchSalesProfit += Number(s.profit || 0);

}


} else if (saleLevel !== '贈品') {

    // 舊資料如果沒有 customerLevel
    monthlyData[m].uncategorizedRevenue += saleAmount;

}
            });
            purchases.forEach(p => {

                    <input id="auth-email" type="email" placeholder="電子信箱 (Email)" class="w-full pl-10 p-4 bg-slate-50 rounded-2xl font-bold text-xs border-none outline-none focus:ring-2 focus:ring-[#FD85AB] transition-all">
                </div>
                <div class="relative">
                    <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 w-4 h-4"></i>
                    <input id="auth-password" type="password" placeholder="密碼 (Password)" class="w-full pl-10 p-4 bg-slate-50 rounded-2xl font-bold text-xs border-none outline-none focus:ring-2 focus:ring-[#FD85AB] transition-all">
                </div>
                
                <button onclick="window.handleAuthAction()" class="w-full py-4 bg-gradient-to-r from-[#FD85AB] to-rose-500 text-white rounded-2xl font-black text-xs shadow-md tracking-wider active:scale-95 transition-all mt-2">
                    <span id="auth-btn-text">立即登入小金庫 ✨</span>
                </button>
            </div>

            <div class="text-center space-y-4">
                <button onclick="window.toggleAuthMode()" class="text-xs font-bold text-[#FD85AB] block mx-auto underline">
                    <span id="auth-switch-text">還沒有雲端帳號？點此去註冊</span>
                </button>

                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-slate-100"></div>
                    <span class="flex-shrink mx-4 text-[10px] text-slate-300 font-bold uppercase tracking-wider">或者是</span>
                    <div class="flex-grow border-t border-slate-100"></div>
                </div>

                <button onclick="window.handleGuestLogin()" class="w-full py-4 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-2xl font-black text-xs transition-all active:scale-95">
                    先以訪客身份體驗 👣
                </button>
                <p class="text-[9px] text-slate-300 font-medium leading-relaxed">提示：訪客數據保存在您當前的手機瀏覽器快取中，換手機或清除快取時資料將會遺失。</p>
            </div>
        </section>

        <div id="app-main-layout" class="hidden flex flex-col flex-1">
            
            <section id="home" class="p-6 pb-44 space-y-6 flex-1 overflow-y-auto no-scrollbar">
                <header class="flex justify-between items-center pt-2">
                    <div><h1 class="text-3xl font-black text-[#FD85AB] tracking-tighter">仙女小金庫1.3</h1><p class="text-[10px] font-bold text-slate-300 uppercase mt-1 tracking-widest">FAIRY MONEY PRO</p></div>
                    <button onclick="window.showTab('settings')" class="bg-pink-50 p-3 rounded-2xl text-[#FD85AB] hover:rotate-45 transition-transform"><i data-lucide="settings"></i></button>
                </header>

                <div id="guest-warning-banner" class="hidden bg-amber-50 border border-amber-100 p-4 rounded-3xl flex items-center gap-3 text-amber-700 animate-pulse">
                    <i data-lucide="shield-alert" class="w-5 h-5 flex-shrink-0 text-amber-500"></i>
                    <span class="text-[10px] font-bold leading-relaxed">⚠️ 目前為臨時訪客模式，換手機資料會遺失。建議立即到「個人設定」註冊永久雲端帳號！</span>
                </div>

                <div class="bg-gradient-to-br from-[#FD85AB] to-rose-400 p-8 rounded-[2.5rem] shadow-xl text-white relative overflow-hidden">
                    <div class="relative z-10">
                        <span class="text-[11px] font-bold opacity-80 uppercase tracking-widest">本月預估淨利</span>
                        <div id="dash-profit" class="text-4xl font-black mt-2">$0</div>
                        <div class="mt-8">
                            <div class="flex justify-between text-[10px] font-black mb-2 uppercase"><span>目標進度</span><span id="dash-prog-text">0%</span></div>
                            <div class="h-2 bg-white/20 rounded-full overflow-hidden">
                                <div id="dash-bar" class="h-full bg-white transition-all duration-1000" style="width:0%"></div>
                            </div>
                        </div>
                    </div>
                    <i data-lucide="sparkles" class="absolute -right-4 -bottom-4 text-white/10 w-28 h-28"></i>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-white p-5 rounded-3xl border border-slate-100 card-shadow">
                        <span class="text-[9px] font-black text-slate-300 uppercase block mb-1">本月銷貨額</span>
                        <div id="dash-revenue" class="text-lg font-black text-slate-800">$0</div>
                    </div>
                    <div class="bg-white p-5 rounded-3xl border border-slate-100 card-shadow">
                        <span class="text-[9px] font-black text-slate-300 uppercase block mb-1">本月進貨支出</span>
                        <div id="dash-pur-cost" class="text-lg font-black text-orange-400">$0</div>
                    </div>
                </div>
                <div class="bg-white p-7 rounded-[2.5rem] border border-pink-50 card-shadow space-y-5">
                    <h3 class="text-xs font-black text-[#FD85AB] uppercase flex items-center gap-2"><i data-lucide="trophy" class="w-4 h-4 text-yellow-500"></i> 本月熱銷 Top 5</h3>
                    <div id="dash-top5" class="space-y-3"></div>
                </div>
                
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="text-xs font-black text-slate-400 uppercase flex items-center gap-2 tracking-widest">
                            <i data-lucide="calendar" class="w-4 h-4 text-pink-400"></i> 月報歷史回顧
                        </h3>
                        <button onclick="window.openExportModal()" class="text-[10px] font-black bg-pink-50 text-[#FD85AB] px-3.5 py-1.5 rounded-full hover:bg-[#FD85AB] hover:text-white transition-all flex items-center gap-1">
                            <i data-lucide="download" class="w-3.5 h-3.5"></i> 輸出報表
                        </button>
                    </div>
                    <div id="dash-history" class="space-y-4"></div>
                </div>
            </section>

            <section id="pricelist" class="p-6 pb-44 space-y-5 hidden flex-1 overflow-y-auto no-scrollbar animate-in fade-in">
                <h2 class="text-2xl font-black text-center text-slate-800 tracking-tight">產品價格對照表</h2>
                <div class="bg-white p-5 rounded-3xl card-shadow border border-slate-50 space-y-4 sticky top-0 z-20">
                    <div id="price-level-filter" class="flex gap-2 overflow-x-auto no-scrollbar pb-1"></div>
                    <div id="price-curr-filter" class="flex gap-2"></div>
                </div>
                <div id="price-grid" class="space-y-3"></div>
            </section>

            <section id="sales" class="p-6 pb-44 space-y-5 hidden flex-1 overflow-y-auto no-scrollbar animate-in fade-in">
                <h2 class="text-2xl font-black text-center text-[#FD85AB] tracking-tight">仙女銷貨</h2>
                <div class="bg-white p-6 rounded-[2.5rem] card-shadow border border-pink-50 space-y-4">
                    <div class="relative">
                        <i data-lucide="user" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 w-4 h-4"></i>
                        <input id="sale-name" type="text" placeholder="客戶名稱" class="w-full pl-10 p-4 bg-slate-50 rounded-2xl font-bold text-xs border-none outline-none focus:ring-2 focus:ring-[#FD85AB] transition-all">
                    </div>
                    <div class="flex gap-2">
                        <input id="sale-date" type="date" class="w-[45%] p-4 bg-slate-50 rounded-2xl font-bold text-xs border-none outline-none">
                        <select id="sale-level" onchange="window.renderSales()" class="w-[30%] p-4 bg-slate-50 rounded-2xl font-black text-[10px] border-none appearance-none outline-none">
                            <option value="贈品">贈品</option>
                            <option value="零售">零售</option>
                            <option value="1+1">1+1</option>
                            <option value="VIP">VIP</option>
                            <option value="實習">實習</option>
                            <option value="三級零售">三級零售</option>
                            <option value="三級加盟">三級加盟</option>
                            <option value="二級">二級</option>
                            <option value="一級">一級</option>
                            <option value="皇家">皇家</option>
                        </select>
                        <select id="sale-curr" onchange="window.renderSales()" class="flex-1 p-4 bg-slate-50 rounded-2xl font-bold text-[10px] border-none outline-none">
                            <option value="TWD">TWD</option><option value="MOP">MOP</option><option value="HKD">HKD</option>
                        </select>
                    </div>
                </div>
                <div class="bg-white rounded-3xl card-shadow border border-slate-50 overflow-hidden"><table class="w-full"><tbody id="sales-list"></tbody></table></div>
                <div class="fixed bottom-28 left-6 right-6 max-w-md mx-auto z-[40]">
                    <button id="submit-sales-btn" disabled onclick="window.submitSales()" class="w-full py-6 bg-gradient-to-r from-[#FD85AB] to-rose-500 text-white rounded-[2rem] font-black shadow-xl active:scale-95 transition-all">
                        <div class="flex justify-between px-8 text-[9px] opacity-80 uppercase mb-1"><span>淨利估算</span><span id="sum-pro">$0</span></div>
                        <div id="sum-rev" class="text-xl font-black">$0</div>
                    </button>
                </div>
            </section>

            <section id="purchase" class="p-6 pb-44 space-y-5 hidden flex-1 overflow-y-auto no-scrollbar animate-in fade-in">
                <h2 class="text-2xl font-black text-center text-[#60D3C2] tracking-tight">仙女進貨</h2>
                <div class="bg-white p-6 rounded-[2.5rem] card-shadow border border-emerald-50 space-y-4">
                    <div class="flex gap-2">
                        <input id="pur-date" type="date" class="w-[45%] p-4 bg-slate-50 rounded-2xl font-bold text-xs border-none outline-none">
                        <select id="pur-level" onchange="window.renderPurchase()" class="w-[30%] p-4 bg-slate-50 rounded-2xl font-black text-[10px] border-none appearance-none outline-none">
                            <option value="贈品">贈品</option>
                            <option value="實習">實習</option>
                            <option value="三級零售">三級零售</option>
                            <option value="三級加盟">三級加盟</option>
                            <option value="二級">二級</option>
                            <option value="一級">一級</option>
                            <option value="皇家">皇家</option>
                        </select>
                        <select id="pur-curr" onchange="window.renderPurchase()" class="flex-1 p-4 bg-slate-50 rounded-2xl font-bold text-[10px] border-none outline-none">
                            <option value="TWD">TWD</option><option value="MOP">MOP</option><option value="HKD">HKD</option>
                        </select>
                    </div>
                </div>
                <div class="bg-white rounded-3xl card-shadow border border-slate-50 overflow-hidden"><table class="w-full"><tbody id="pur-list"></tbody></table></div>
                <div class="fixed bottom-28 left-6 right-6 max-w-md mx-auto z-[40]">
                    <button id="submit-pur-btn" disabled onclick="window.submitPurchase()" class="w-full py-6 bg-[#60D3C2] text-white rounded-[2rem] font-black shadow-xl">
                        <div class="text-[10px] opacity-80 uppercase mb-1 text-center">進貨總成本</div>
                        <div id="sum-pur-cost" class="text-xl font-black text-center">$0</div>
                    </button>
                </div>
            </section>

            <section id="record" class="p-6 pb-44 space-y-6 hidden flex-1 overflow-y-auto no-scrollbar animate-in fade-in">
                <h2 class="text-2xl font-black text-center text-slate-800 tracking-tight">歷史明細紀錄</h2>
                <div class="relative">
                    <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 w-5 h-5"></i>
                    <input type="text" placeholder="搜尋客戶或產品..." oninput="handleSearch(this.value)" class="w-full pl-12 p-4 bg-white rounded-2xl font-bold text-sm card-shadow border-none outline-none focus:ring-2 focus:ring-[#FD85AB] transition-all">
                </div>
                <div id="rec-list"></div>
            </section>

            <section id="inventory" class="p-6 pb-44 space-y-6 hidden flex-1 overflow-y-auto no-scrollbar animate-in fade-in">
                <h2 class="text-2xl font-black text-center text-slate-800 tracking-tight">現貨庫存監控</h2>
                <div class="bg-slate-900 p-7 rounded-[2.5rem] text-white shadow-xl flex justify-between items-center mb-6">
                    <div><div class="text-[11px] font-black text-slate-400 uppercase tracking-widest">目前庫存總價值</div><div id="inv-total-value" class="text-[28px] font-black">$0</div></div>
                    <div class="p-4 bg-[#FD85AB]/20 rounded-2xl"><i data-lucide="package" class="w-8 h-8 text-[#FD85AB]"></i></div>
                </div>
                <div id="inv-grid" class="grid grid-cols-2 gap-3"></div>
            </section>

            <section id="settings" class="p-6 pb-44 space-y-7 hidden flex-1 overflow-y-auto no-scrollbar animate-in fade-in">
                <h2 class="text-2xl font-black text-center text-slate-800 tracking-tight">個人設定</h2>
                
                <div class="bg-white p-8 rounded-[3rem] card-shadow border border-slate-50 space-y-6">
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase block mb-3 tracking-widest">雲端帳號同步狀態</label>
                        <div id="login-account-status"></div>
                    </div>

                    <div><label class="text-[10px] font-black text-slate-400 uppercase block mb-4 tracking-widest">我本身的代理等級</label><div id="set-level" class="grid grid-cols-3 gap-2"></div></div>
                    <div><label class="text-[10px] font-black text-slate-400 uppercase block mb-4 tracking-widest">主要幣別</label><div id="set-curr" class="flex gap-2"></div></div>
                    <div><label class="text-[10px] font-black text-slate-400 uppercase block mb-4 tracking-widest">每月獲利目標</label><input id="set-goal" type="number" class="w-full p-4 bg-slate-50 rounded-[1.5rem] border-none text-2xl font-black outline-none shadow-inner focus:ring-2 focus:ring-slate-800 transition-all"></div>
                    
                    <button onclick="window.saveProfile()" class="w-full py-5 bg-slate-900 text-white rounded-[2rem] font-black shadow-xl flex items-center justify-center gap-2 active:scale-95 transition-all">儲存並同步設定 💾</button>
                    
                    <button onclick="window.handleLogout()" class="w-full py-4 border border-red-200 text-red-500 hover:bg-red-50 rounded-[2rem] font-black text-xs transition-all active:scale-95">
                        🚪 安全登出當前帳號
                    </button>
                </div>
            </section>

            <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/95 backdrop-blur-xl border-t border-slate-100 flex justify-around py-4 px-2 pb-[calc(1.5rem+env(safe-area-inset-bottom))] z-50 rounded-t-[3rem] shadow-[0_-15px_50px_rgba(0,0,0,0.06)]">
                <button onclick="window.showTab('home')" class="nav-btn flex flex-col items-center gap-1 text-[#FD85AB] group" data-tab="home"><div class="icon-bg p-2 rounded-2xl bg-pink-50 transition-all group-hover:scale-110"><i data-lucide="layout-dashboard" class="w-5 h-5"></i></div><span class="text-[8px] font-black uppercase tracking-tighter">首頁</span></button>
                <button onclick="window.showTab('pricelist')" class="nav-btn flex flex-col items-center gap-1 text-slate-300 group" data-tab="pricelist"><div class="icon-bg p-2 rounded-2xl transition-all group-hover:scale-110"><i data-lucide="tag" class="w-5 h-5"></i></div><span class="text-[8px] font-black uppercase tracking-tighter">價格</span></button>
                <button onclick="window.showTab('sales')" class="nav-btn flex flex-col items-center gap-1 text-slate-300 group" data-tab="sales"><div class="icon-bg p-2 rounded-2xl transition-all group-hover:scale-110"><i data-lucide="shopping-cart" class="w-5 h-5"></i></div><span class="text-[8px] font-black uppercase tracking-tighter">銷貨</span></button>
                <button onclick="window.showTab('purchase')" class="nav-btn flex flex-col items-center gap-1 text-slate-300 group" data-tab="purchase"><div class="icon-bg p-2 rounded-2xl transition-all group-hover:scale-110"><i data-lucide="truck" class="w-5 h-5"></i></div><span class="text-[8px] font-black uppercase tracking-tighter">進貨</span></button>
                <button onclick="window.showTab('record')" class="nav-btn flex flex-col items-center gap-1 text-slate-300 group" data-tab="record"><div class="icon-bg p-2 rounded-2xl transition-all group-hover:scale-110"><i data-lucide="clipboard-list" class="w-5 h-5"></i></div><span class="text-[8px] font-black uppercase tracking-tighter">紀錄</span></button>
                <button onclick="window.showTab('inventory')" class="nav-btn flex flex-col items-center gap-1 text-slate-300 group" data-tab="inventory"><div class="icon-bg p-2 rounded-2xl transition-all group-hover:scale-110"><i data-lucide="package" class="w-5 h-5"></i></div><span class="text-[8px] font-black uppercase tracking-tighter">庫存</span></button>
            </nav>

        </div>

        <div id="export-modal" class="fixed inset-0 z-[300] flex items-center justify-center bg-black/40 backdrop-blur-sm hidden">
            <div class="bg-white w-[85%] max-w-sm rounded-[3rem] p-8 shadow-2xl space-y-6 animate-in zoom-in-95 duration-200">
                <div class="text-center space-y-2">
                    <div class="bg-pink-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto text-[#FD85AB] mb-4">
                        <i data-lucide="file-spreadsheet" class="w-8 h-8"></i>
                    </div>
                    <h4 class="text-xl font-black text-slate-800 tracking-tight">輸出月報歷史回顧</h4>
                    <p class="text-xs font-bold text-slate-400 leading-relaxed">請選擇您喜愛的報表輸出方式：</p>
                </div>
                <div class="space-y-3">
                    <button onclick="window.triggerCSVExport()" class="w-full py-4 bg-gradient-to-r from-[#FD85AB] to-rose-400 text-white rounded-2xl font-black text-xs shadow-md flex items-center justify-center gap-2">
                        <i data-lucide="download" class="w-4 h-4"></i> 下載 Excel CSV 檔案
                    </button>
                    <button onclick="window.triggerTextCopy()" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-black text-xs shadow-md flex items-center justify-center gap-2">
                        <i data-lucide="copy" class="w-4 h-4 text-pink-300"></i> 複製 LINE 夢幻純文字
                    </button>
                    <button onclick="window.closeExportModal()" class="w-full py-4 bg-slate-100 text-slate-500 rounded-2xl font-black text-xs">
                        取消
                    </button>
                </div>
            </div>
        </div>

        <div id="confirm-modal" class="fixed inset-0 z-[300] flex items-center justify-center bg-black/40 backdrop-blur-sm hidden">
            <div class="bg-white w-[85%] max-w-sm rounded-[3rem] p-8 shadow-2xl space-y-6 animate-in zoom-in-95 duration-200">
                <div class="text-center space-y-2">
                    <div class="bg-red-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto text-red-500 mb-4"><i data-lucide="alert-triangle" class="w-8 h-8"></i></div>
                    <h4 class="text-xl font-black text-slate-800 tracking-tight">刪除確認</h4>
                    <p id="confirm-msg" class="text-sm font-bold text-slate-400 leading-relaxed"></p>
                </div>
                <div class="flex gap-3">
                    <button onclick="window.closeConfirm(false)" class="flex-1 py-4 bg-slate-100 text-slate-500 rounded-2xl font-black text-xs active:bg-slate-200">先不要</button>
                    <button onclick="window.closeConfirm(true)" class="flex-1 py-4 bg-red-500 text-white rounded-2xl font-black text-xs shadow-lg shadow-red-100 active:bg-red-700">確定刪除</button>
                </div>
            </div>
        </div>

        <div id="fairy-toast" class="fixed top-8 left-1/2 -translate-x-1/2 z-[500] w-[80%] hidden animate-in slide-in-from-top-10 duration-500">
            <div class="bg-slate-900 text-white p-4 rounded-3xl shadow-2xl flex items-center justify-center gap-3">
                <i data-lucide="sparkles" class="w-5 h-5 text-yellow-400"></i><span id="toast-msg" class="text-sm font-black"></span>
            </div>
        </div>
    </div>
</body>
</html>
